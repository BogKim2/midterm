[project]
name = "perceptron-trainer"
version = "0.1.0"
description = "Educational perceptron trainer GUI and neural-network learning demos."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.3.0",
    "PySide6>=6.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["perceptron_app/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perceptron_app"]
