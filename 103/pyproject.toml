[project]
name = "smart-doc-analyzer"
version = "0.1.0"
description = "Local desktop document analyzer with PySide6 and LM Studio integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "Pillow>=10.0",
  "PySide6>=6.7",
  "pytest>=8.0",
  "requests>=2.32",
  "textstat>=0.7",
  "wordcloud>=1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
smart-doc-analyzer = "smart_doc_analyzer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_doc_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:cacheprovider"]
